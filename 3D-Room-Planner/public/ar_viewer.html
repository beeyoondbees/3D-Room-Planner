<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AR Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      background: #000;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #ar-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 24px;
      background: linear-gradient(135deg, #e4002b, #ff416c);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

<model-viewer
  id="arViewer"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  auto-rotate
  environment-image="neutral"
  src=""
  ios-src=""
  allow="camera; microphone; fullscreen; xr-spatial-tracking"
  exposure="1"
  shadow-intensity="1"
  loading="eager"
  reveal="auto">
</model-viewer>

<button id="ar-button">View in AR</button>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const modelName = urlParams.get("model") || "Sportstech-sBike";
  const baseUrl = "https://d3hu0a43t9wj79.cloudfront.net/assets/models/";
  const glbUrl = `${baseUrl}${modelName}.glb`;
  const usdzUrl = `${baseUrl}${modelName}.usdz`;

  const viewer = document.getElementById("arViewer");
  const arButton = document.getElementById("ar-button");

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);

  viewer.setAttribute("src", glbUrl);
  viewer.setAttribute("ios-src", usdzUrl);

  arButton.textContent = `${modelName.replace(/-/g, ' ')} - View in AR`;

  arButton.addEventListener("click", () => {
    if (isIOS) {
      window.location.href = usdzUrl;
    } else if (isAndroid) {
      viewer.activateAR();
    }
  });

  viewer.addEventListener('load', () => {
    arButton.style.display = 'block';
  });

  viewer.addEventListener('ar-status', (event) => {
    if (event.detail.status === 'not-presenting') {
      arButton.style.display = 'block';
    }
  });
</script>

</body>
</html>
